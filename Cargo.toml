[package]
name = "credo2"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.4.1", features = ["server", "transport-io"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
anyhow = "1"
axum = "0.8.9"
chrono = "0.4"
sha2 = "0.11"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"