# rustfmt.toml

# Edition для standalone-вызовов rustfmt (харнесс-форматтер) — согласован
# с `cargo fmt` (Cargo.toml edition = "2024"); style edition следует за edition.
edition = "2024"

# Максимальная ширина строки
max_width = 80

# Ширина отступа в пробелах
tab_spaces = 4

# Отступы в match-выражениях
match_block_trailing_comma = true

# Запрещает слияние атрибутов с элементами
merge_derives = true