<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREDO — DAR Notebook</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.0/index.css">
<style>
  /* ============ Design Tokens ============ */
  :root {
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
    --tap: 44px;
    --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
    --focus-ring: 0 0 0 2px var(--accent-500), 0 0 0 4px rgba(59, 130, 246, 0.3);
  }

  [data-theme="dark"] {
    --bg-0: #0b0f17;
    --bg-1: #111826;
    --bg-2: #1a2232;
    --bg-3: #232d40;
    --bg-hover: rgba(255, 255, 255, 0.04);
    --bg-active: rgba(59, 130, 246, 0.12);
    --border: #2a3446;
    --border-strong: #3a4660;
    --text-0: #f3f4f6;
    --text-1: #d1d5db;
    --text-2: #9ca3af;
    --text-3: #6b7280;
    --text-muted: #4b5563;
    --accent-500: #3b82f6;
    --accent-600: #2563eb;
    --accent-700: #1d4ed8;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #06b6d4;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
    --cm-bg: #0b0f17;
    --cm-gutter: #1a2232;
    --cm-gutterText: #4b5563;
    --cm-cursor: #3b82f6;
    --cm-selection: rgba(59, 130, 246, 0.25);
  }

  [data-theme="light"] {
    --bg-0: #ffffff;
    --bg-1: #f8fafc;
    --bg-2: #f1f5f9;
    --bg-3: #e2e8f0;
    --bg-hover: rgba(0, 0, 0, 0.03);
    --bg-active: rgba(59, 130, 246, 0.08);
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text-0: #0f172a;
    --text-1: #334155;
    --text-2: #64748b;
    --text-3: #94a3b8;
    --text-muted: #cbd5e1;
    --accent-500: #2563eb;
    --accent-600: #1d4ed8;
    --accent-700: #1e40af;
    --success: #059669;
    --warning: #d97706;
    --danger: #dc2626;
    --info: #0891b2;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
    --cm-bg: #ffffff;
    --cm-gutter: #f1f5f9;
    --cm-gutterText: #94a3b8;
    --cm-cursor: #2563eb;
    --cm-selection: rgba(37, 99, 235, 0.2);
  }

  /* ============ Base ============ */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-0);
    color: var(--text-0);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input, textarea, select {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
  }
  button:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }
  :focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
    border-radius: var(--radius-sm);
  }

  /* ============ Scrollbars ============ */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 5px;
    border: 2px solid var(--bg-1);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

  /* ============ Layout ============ */
  .app {
    display: grid;
    grid-template-rows: auto auto 1fr;
    height: 100vh;
  }
  .header {
    background: var(--bg-1);
    border-bottom: 1px solid var(--border);
    padding: var(--sp-3) var(--sp-4);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }
  .header-left, .header-right { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
  .brand { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
  .brand-logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent-500), var(--accent-700));
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .brand-logo svg { width: 18px; height: 18px; color: white; }
  .brand-text h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .brand-text p { font-size: 11px; color: var(--text-2); margin: 0; }
  .breadcrumbs { display: flex; align-items: center; gap: var(--sp-1); font-size: 13px; color: var(--text-2); }
  .breadcrumbs span:hover { color: var(--accent-500); cursor: pointer; }
  .breadcrumbs .current { color: var(--accent-500); font-weight: 500; }
  .status-chip {
    display: inline-flex; align-items: center; gap: var(--sp-2);
    padding: 6px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 12px;
    color: var(--text-1);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success); }

  .mobile-nav {
    display: flex;
    background: var(--bg-1);
    border-bottom: 1px solid var(--border);
  }
  .mobile-nav button {
    flex: 1;
    padding: var(--sp-3);
    min-height: var(--tap);
    display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
    font-size: 12px; font-weight: 500;
    color: var(--text-2);
    border-bottom: 2px solid transparent;
    transition: background var(--transition), color var(--transition);
  }
  .mobile-nav button[aria-selected="true"] {
    color: var(--text-0);
    border-bottom-color: var(--accent-500);
  }
  .mobile-nav button:hover { background: var(--bg-hover); }

  .main {
    display: grid;
    grid-template-columns: 288px 1fr 400px;
    min-height: 0;
    overflow: hidden;
  }

  /* ============ Panels ============ */
  .panel {
    background: var(--bg-1);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .panel-left { border-right: 1px solid var(--border); }
  .panel-right { border-left: 1px solid var(--border); }
  .panel-center { background: var(--bg-0); }

  .panel-section {
    padding: var(--sp-4);
    border-bottom: 1px solid var(--border);
  }
  .panel-section:last-child { border-bottom: none; }
  .panel-section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--sp-3);
  }
  .panel-section-title {
    font-size: 11px; font-weight: 600;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .scroll-area { flex: 1; overflow-y: auto; min-height: 0; }

  /* ============ Buttons ============ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: var(--sp-2);
    padding: 8px 12px;
    min-height: var(--tap);
    border-radius: var(--radius-md);
    font-size: 13px; font-weight: 500;
    transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
    position: relative;
    white-space: nowrap;
  }
  .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .btn-icon { padding: 8px; min-width: var(--tap); min-height: var(--tap); }
  .btn-primary {
    background: var(--accent-600);
    color: white;
    box-shadow: var(--shadow-sm);
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-700);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
  }
  .btn-secondary {
    background: var(--bg-2);
    color: var(--text-1);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--bg-3); }
  .btn-ghost { color: var(--text-2); }
  .btn-ghost:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-0); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover:not(:disabled) { filter: brightness(1.1); }

  /* ============ File list ============ */
  .file-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: background var(--transition);
    margin-bottom: 2px;
    min-height: var(--tap);
  }
  .file-item:hover { background: var(--bg-hover); }
  .file-item[aria-selected="true"] {
    background: var(--bg-active);
    border-left-color: var(--accent-500);
  }
  .file-item-main { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .file-icon {
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .file-icon svg { width: 16px; height: 16px; }
  .file-meta { min-width: 0; flex: 1; }
  .file-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

  .badge {
    display: inline-flex; align-items: center;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge-draft { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
  .badge-published { background: rgba(16, 185, 129, 0.15); color: var(--success); }
  .badge-archived { background: rgba(107, 114, 128, 0.2); color: var(--text-2); }
  .badge-info { background: rgba(59, 130, 246, 0.15); color: var(--accent-500); }
  .badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

  /* ============ Versions ============ */
  .version-item {
    padding: 10px 12px;
    border-radius: var(--radius-md);
    margin-bottom: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background var(--transition);
  }
  .version-item:hover { background: var(--bg-hover); }
  .version-item.active {
    background: linear-gradient(90deg, rgba(16, 185, 129, 0.08), transparent);
    border-color: rgba(16, 185, 129, 0.3);
  }
  .version-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .version-tag { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
  .version-desc { font-size: 11px; color: var(--text-2); }

  /* ============ Editor ============ */
  .editor-header {
    background: var(--bg-1);
    border-bottom: 1px solid var(--border);
    padding: var(--sp-3) var(--sp-4);
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--sp-3);
  }
  .editor-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: var(--sp-2); }
  .editor-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .editor-toolbar { display: flex; align-items: center; gap: var(--sp-2); }
  .toolbar-divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

  .editor-wrap {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .cm-editor {
    flex: 1;
    height: 100%;
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--cm-bg);
  }
  .cm-editor .cm-scroller { overflow: auto; font-family: var(--font-mono); }
  .cm-editor .cm-gutters {
    background: var(--cm-gutter);
    color: var(--cm-gutterText);
    border-right: 1px solid var(--border);
  }
  .cm-editor .cm-activeLineGutter { background: var(--bg-hover); }
  .cm-editor .cm-activeLine { background: var(--bg-hover); }
  .cm-editor .cm-selectionBackground { background: var(--cm-selection) !important; }
  .cm-editor .cm-cursor { border-left-color: var(--cm-cursor); }
  .cm-editor.cm-focused { outline: none; }

  /* DSL syntax tokens */
  .tok-keyword { color: #c678dd; font-weight: 600; }
  .tok-string { color: #98c379; }
  .tok-number { color: #d19a66; }
  .tok-comment { color: #5c6370; font-style: italic; }
  .tok-operator { color: #56b6c2; }
  .tok-field { color: #61afef; }
  .tok-ident { color: #e5c07b; }
  .tok-punctuation { color: #abb2bf; }
  [data-theme="light"] .tok-keyword { color: #8250df; }
  [data-theme="light"] .tok-string { color: #0a7d32; }
  [data-theme="light"] .tok-number { color: #bc4d00; }
  [data-theme="light"] .tok-comment { color: #6a737d; }
  [data-theme="light"] .tok-operator { color: #0550ae; }
  [data-theme="light"] .tok-field { color: #0550ae; }
  [data-theme="light"] .tok-ident { color: #953800; }
  [data-theme="light"] .tok-punctuation { color: #57606a; }

  .status-bar {
    background: var(--bg-1);
    border-top: 1px solid var(--border);
    padding: 6px var(--sp-4);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px;
    color: var(--text-2);
  }
  .status-bar-left, .status-bar-right { display: flex; align-items: center; gap: var(--sp-4); }
  .status-indicator { display: flex; align-items: center; gap: 6px; }

  /* ============ Results panel ============ */
  .results-panel {
    background: var(--bg-1);
    border-top: 1px solid var(--border);
    padding: var(--sp-4);
    max-height: 40vh;
    overflow-y: auto;
  }
  .results-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--sp-3);
  }
  .results-title { display: flex; align-items: center; gap: var(--sp-3); }
  .results-icon {
    width: 32px; height: 32px;
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
  }
  .results-icon.success { background: rgba(16, 185, 129, 0.12); color: var(--success); }
  .results-icon.error { background: rgba(239, 68, 68, 0.12); color: var(--danger); }
  .results-icon svg { width: 20px; height: 20px; }

  .result-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--success);
    border-radius: var(--radius-md);
    padding: var(--sp-4);
  }
  .result-card.error { border-left-color: var(--danger); }
  .result-row {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 6px 0;
    font-size: 13px;
  }
  .result-label { color: var(--text-2); min-width: 160px; flex-shrink: 0; }
  .result-value { font-family: var(--font-mono); color: var(--text-0); }
  .result-value.decision-approve { color: var(--success); font-weight: 600; }
  .result-value.decision-reject { color: var(--danger); font-weight: 600; }

  .trace-list {
    margin-top: var(--sp-3);
    padding: var(--sp-3);
    background: var(--bg-0);
    border-radius: var(--radius-sm);
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .trace-item { padding: 4px 0; color: var(--text-1); }
  .trace-item.pass { color: var(--success); }
  .trace-item.fail { color: var(--danger); }
  .trace-item.skip { color: var(--text-3); }
  .trace-item::before {
    content: '→';
    margin-right: 8px;
    color: var(--text-3);
  }

  /* ============ Chat ============ */
  .chat-header {
    background: linear-gradient(90deg, var(--bg-2), var(--bg-1));
    padding: var(--sp-4);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .chat-user { display: flex; align-items: center; gap: var(--sp-3); }
  .chat-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-500), var(--accent-700));
    display: flex; align-items: center; justify-content: center;
    position: relative;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .chat-avatar svg { width: 22px; height: 22px; color: white; }
  .chat-avatar-status {
    position: absolute; bottom: 0; right: 0;
    width: 12px; height: 12px;
    background: var(--success);
    border: 2px solid var(--bg-1);
    border-radius: 50%;
  }
  .chat-name { font-weight: 600; font-size: 14px; }
  .chat-status { font-size: 11px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: var(--sp-4);
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
  }
  .msg { display: flex; gap: 10px; animation: fadeIn 0.25s ease-out; }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-500), var(--accent-700));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .msg-avatar svg { width: 16px; height: 16px; color: white; }
  .msg-bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: var(--radius-lg);
    font-size: 13px;
    line-height: 1.5;
    box-shadow: var(--shadow-sm);
  }
  .msg.ai .msg-bubble {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .msg.user .msg-bubble {
    background: var(--accent-600);
    color: white;
    border-top-right-radius: 4px;
  }
  .msg-time { font-size: 10px; color: var(--text-3); margin-top: 4px; }
  .msg.user .msg-time { text-align: right; color: rgba(255,255,255,0.7); }
  .msg-code {
    background: var(--bg-0);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
    margin: 8px 0;
    font-family: var(--font-mono);
    font-size: 12px;
    overflow-x: auto;
    white-space: pre;
  }
  .msg-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .msg-action {
    padding: 4px 10px;
    background: var(--bg-3);
    border-radius: var(--radius-sm);
    font-size: 11px;
    color: var(--text-1);
    transition: background var(--transition);
  }
  .msg-action:hover { background: var(--border-strong); }

  .typing-indicator { display: flex; gap: 4px; padding: 8px 0; }
  .typing-dot {
    width: 6px; height: 6px;
    background: var(--text-3);
    border-radius: 50%;
    animation: typingBounce 1.4s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  .chat-input-area {
    padding: var(--sp-3) var(--sp-4);
    border-top: 1px solid var(--border);
    background: var(--bg-1);
  }
  .chat-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .chat-input {
    flex: 1;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    min-height: var(--tap);
    transition: border-color var(--transition);
  }
  .chat-input:focus { outline: none; border-color: var(--accent-500); box-shadow: var(--focus-ring); }
  .chat-quick-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ============ Modal ============ */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: var(--sp-4);
    animation: fadeIn 0.2s ease-out;
  }
  .modal {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--sp-5);
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.25s ease-out;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--sp-4);
  }
  .modal-title-wrap { display: flex; align-items: center; gap: var(--sp-3); }
  .modal-icon {
    width: 40px; height: 40px;
    border-radius: var(--radius-md);
    background: rgba(59, 130, 246, 0.12);
    color: var(--accent-500);

  }
  .modal-icon svg { width: 22px; height: 22px; }

  .form-group { margin-bottom: var(--sp-4); }

    color: var(--danger);

  }
  .form-error svg { width: 14px; height: 14px; flex-shrink: 0; }
  .form-hint { font-size: 11px; color: var(--text-3); margin-top: 4px; }

  .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .modal-actions .btn { flex: 1; min-width: 120px; }

  /* ============ Empty state ============ */
  .empty-state {
    padding: var(--sp-6);
    text-align: center;
    color: var(--text-3);
  }
  .empty-state-icon {
    width: 48px; height: 48px;
    margin: 0 auto var(--sp-3);
    color: var(--text-3);

  }
  .empty-state-title { font-size: 14px; font-weight: 500; color: var(--text-2); margin-bottom: 4px; }
  .empty-state-text { font-size: 12px; }

  /* ============ Toast ============ */
  .toast-container {
    position: fixed;
    bottom: 20px; right: 20px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 200;
    pointer-events: none;
  }
  .toast {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent-500);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    min-width: 260px;
    max-width: 380px;
    box-shadow: var(--shadow-md);
    display: flex; align-items: flex-start; gap: 10px;
    animation: slideInRight 0.3s ease-out;
    pointer-events: auto;
  }
  .toast.success { border-left-color: var(--success); }
  .toast.error { border-left-color: var(--danger); }
  .toast.warning { border-left-color: var(--warning); }
  .toast-icon { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
  .toast-content { flex: 1; font-size: 13px; }
  .toast-title { font-weight: 600; margin-bottom: 2px; }
  .toast-message { color: var(--text-2); font-size: 12px; }

  /* ============ Diff ============ */
  .diff-view {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--bg-0);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-top: var(--sp-3);
  }
  .diff-line {
    padding: 2px 12px;
    white-space: pre;
    display: flex;
    gap: 12px;
  }
  .diff-line-num { color: var(--text-3); min-width: 24px; text-align: right; user-select: none; }
  .diff-line.added { background: rgba(16, 185, 129, 0.1); color: var(--success); }
  .diff-line.removed { background: rgba(239, 68, 68, 0.1); color: var(--danger); text-decoration: line-through; }
  .diff-line.ctx { color: var(--text-2); }

  /* ============ Animations ============ */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ============ Responsive ============ */
  @media (max-width: 1023px) {
    .main { grid-template-columns: 1fr; }
    .panel-left, .panel-right { display: none; }
    .panel-left.visible, .panel-right.visible { display: flex; }
    .panel-center.hidden-mobile { display: none; }
    .breadcrumbs { display: none; }
  }
  @media (min-width: 1024px) {
    .mobile-nav { display: none; }

    position: fixed;
    bottom: 20px; left: 20px;

    font-family: var(--font-mono);
    font-size: 11px;
  }
  .dev-panel button:hover { background: var(--border-strong); }

const Storage = (() => {

  const isAvailable = (() => {
    try {

      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch { return false; }
  })();

  return {
    load() {
      try {
        if (isAvailable) {
          const raw = localStorage.getItem(Config.STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        }
        return memoryFallback;
      } catch (e) {
        console.warn('Storage load failed:', e);
        return null;
      }
    },
    save(data) {
      try {
        const serialized = JSON.stringify(data);
        if (isAvailable) localStorage.setItem(Config.STORAGE_KEY, serialized);
        else memoryFallback = serialized;
        return true;
      } catch (e) {
        console.warn('Storage save failed:', e);
        return false;
      }
    }
  };
})();

/* ============================================================
 *  MODULE: DslParser (lexer + parser + interpreter + tests)
 * ============================================================ */
const DslParser = (() => {
  /* ---------- Lexer ---------- */
  const TokenType = {
    RULE: 'RULE', IF: 'IF', ELSE: 'ELSE', ELSEIF: 'ELSEIF',
    IDENT: 'IDENT', DOT: 'DOT', NUMBER: 'NUMBER', STRING: 'STRING',
    OP: 'OP', AND: 'AND', OR: 'OR', NOT: 'NOT',
    LBRACE: 'LBRACE', RBRACE: 'RBRACE', LPAREN: 'LPAREN', RPAREN: 'RPAREN',
    COMMA: 'COMMA', SEMICOLON: 'SEMICOLON', ASSIGN: 'ASSIGN',
    EOF: 'EOF', ERROR: 'ERROR'
  };

  const KEYWORDS = {
    'Правило': TokenType.RULE, 'Rule': TokenType.RULE,
    'Если': TokenType.IF, 'If': TokenType.IF,
    'ИначеЕсли': TokenType.ELSEIF, 'ElseIf': TokenType.ELSEIF,
    'Иначе': TokenType.ELSE, 'Else': TokenType.ELSE,
    'И': TokenType.AND, 'AND': TokenType.AND,
    'ИЛИ': TokenType.OR, 'OR': TokenType.OR,
    'НЕ': TokenType.NOT, 'NOT': TokenType.NOT,
    'Решение': TokenType.IDENT, 'Decision': TokenType.IDENT,
    'Причина': TokenType.IDENT, 'Reason': TokenType.IDENT,
    'Отказ': TokenType.IDENT, 'Reject': TokenType.IDENT,
    'Одобрено': TokenType.IDENT, 'Approve': TokenType.IDENT,
    'ОграниченныйЛимит': TokenType.IDENT, 'LimitedLimit': TokenType.IDENT,
  };

  function tokenize(source) {
    const tokens = [];
    let i = 0;
    const len = source.length;
    let line = 1, col = 1;

    const advance = (n = 1) => {
      for (let k = 0; k < n; k++) {
        if (source[i + k] === '\n') { line++; col = 1; }
        else col++;
      }
      i += n;
    };
    const peek = (o = 0) => source[i + o];
    const mk = (type, value, startLine = line, startCol = col) => ({ type, value, line: startLine, col: startCol });

    while (i < len) {
      const startLine = line, startCol = col;
      const ch = peek();

      if (/\s/.test(ch)) { advance(); continue; }

      if (ch === '/' && peek(1) === '/') {
        while (i < len && peek() !== '\n') advance();
        continue;
      }
      if (ch === '/' && peek(1) === '*') {
        advance(2);
        while (i < len && !(peek() === '*' && peek(1) === '/')) advance();
        if (i < len) advance(2);
        continue;
      }

      if (ch === '"' || ch === "'") {
        const quote = ch;
        advance();
        let str = '';
        while (i < len && peek() !== quote) {
          if (peek() === '\\' && i + 1 < len) {
            advance();
            const esc = peek();
            advance();
            str += esc === 'n' ? '\n' : esc === 't' ? '\t' : esc;
          } else {
            str += peek();
            advance();
          }
        }
        if (peek() !== quote) {
          tokens.push(mk(TokenType.ERROR, `Unterminated string`, startLine, startCol));
          return tokens;
        }
        advance();
        tokens.push(mk(TokenType.STRING, str, startLine, startCol));
        continue;
      }

      if (/[0-9]/.test(ch)) {
        let num = '';
        while (i < len && /[0-9.]/.test(peek())) { num += peek(); advance(); }
        tokens.push(mk(TokenType.NUMBER, parseFloat(num), startLine, startCol));
        continue;
      }

      if (/[A-Za-zА-Яа-яЁё_]/.test(ch)) {
        let id = '';
        while (i < len && /[A-Za-zА-Яа-яЁё0-9_]/.test(peek())) { id += peek(); advance(); }
        const type = KEYWORDS[id] ?? TokenType.IDENT;
        tokens.push(mk(type, id, startLine, startCol));
        continue;
      }

      const two = peek() + peek(1);
      if (two === '<=' || two === '>=' || two === '!=' || two === '==' || two === '&&' || two === '||') {
        tokens.push(mk(TokenType.OP, two, startLine, startCol));
        advance(2);
        continue;
      }
      const singleMap = {
        '<': TokenType.OP, '>': TokenType.OP, '=': TokenType.ASSIGN,
        '{': TokenType.LBRACE, '}': TokenType.RBRACE,
        '(': TokenType.LPAREN, ')': TokenType.RPAREN,
        ',': TokenType.COMMA, ';': TokenType.SEMICOLON,
        '.': TokenType.DOT
      };
      if (singleMap[ch]) {
        tokens.push(mk(singleMap[ch], ch, startLine, startCol));
        advance();
        continue;
      }

      tokens.push(mk(TokenType.ERROR, `Unexpected character: ${ch}`, startLine, startCol));
      advance();
    }
    tokens.push(mk(TokenType.EOF, null));
    return tokens;
  }

  /* ---------- Parser ---------- */
  function parse(tokens) {
    let pos = 0;
    const peek = (o = 0) => tokens[pos + o];
    const eat = (type) => {
      const t = peek();
      if (t.type !== type) throw new Error(`Expected ${type} but got ${t.type} ("${t.value}") at ${t.line}:${t.col}`);
      pos++;
      return t;
    };
    const match = (...types) => {
      if (types.includes(peek().type)) { pos++; return tokens[pos - 1]; }
      return null;
    };

    function parseProgram() {
      const rule = parseRule();
      eat(TokenType.EOF);
      return { type: 'Program', rule };
    }

    function parseRule() {
      eat(TokenType.RULE);
      const name = eat(TokenType.IDENT);
      eat(TokenType.LBRACE);
      const body = parseBody();
      eat(TokenType.RBRACE);
      return { type: 'Rule', name: name.value, body };
    }

    function parseBody() {
      const stmts = [];
      while (peek().type !== TokenType.RBRACE && peek().type !== TokenType.EOF) {
        stmts.push(parseStatement());
      }
      return stmts;
    }

    function parseStatement() {
      if (peek().type === TokenType.IF) return parseIf();
      return parseAssign();
    }

    function parseIf() {
      eat(TokenType.IF);
      eat(TokenType.LPAREN);
      const test = parseExpr();
      eat(TokenType.RPAREN);
      eat(TokenType.LBRACE);
      const consequent = parseBody();
      eat(TokenType.RBRACE);
      const elifs = [];
      while (peek().type === TokenType.ELSEIF) {
        pos++;
        eat(TokenType.LPAREN);
        const t = parseExpr();
        eat(TokenType.RPAREN);
        eat(TokenType.LBRACE);
        const b = parseBody();
        eat(TokenType.RBRACE);
        elifs.push({ test: t, body: b });
      }
      let alternate = null;
      if (peek().type === TokenType.ELSE) {
        pos++;
        eat(TokenType.LBRACE);
        alternate = parseBody();
        eat(TokenType.RBRACE);
      }
      return { type: 'If', test, consequent, elifs, alternate };
    }

    function parseAssign() {
      const target = eat(TokenType.IDENT);
      eat(TokenType.ASSIGN);
      const value = parseExpr();
      match(TokenType.SEMICOLON);
      return { type: 'Assign', target: target.value, value };
    }

    function parseExpr() { return parseOr(); }

    function parseOr() {
      let left = parseAnd();
      while (peek().type === TokenType.OR) {
        pos++;
        const right = parseAnd();
        left = { type: 'Binary', op: 'OR', left, right };
      }
      return left;
    }
    function parseAnd() {
      let left = parseComparison();
      while (peek().type === TokenType.AND) {
        pos++;
        const right = parseComparison();
        left = { type: 'Binary', op: 'AND', left, right };
      }
      return left;
    }
    function parseComparison() {
      let left = parseUnary();
      const t = peek();

    document.addEventListener('keydown', esc, true);
    document.body.appendChild(backdrop);
    return { close, backdrop, modal };
  }

  function toast(title, message, type = 'info', duration = 3000) {
    const container = document.getElementById('toasts');
    const iconName = type === 'success' ? 'check' : type === 'error' ? 'x' : type === 'warning' ? 'warn' : 'info';
    const el = h('div', { class: `toast ${type}`, role: 'status' },
      h('div', { class: 'toast-icon' }, icon(iconName, 18)),
      h('div', { class: 'toast-content' },
        h('div', { class: 'toast-title' }, title),
        message ? h('div', { class: 'toast-message' }, message) : null
      )
    );
    container.appendChild(el);
    setTimeout(() => {
      el.style.animation = 'fadeIn 0.2s ease-out reverse';
      setTimeout(() => el.remove(), 200);
    }, duration);
  }

  return { h, icon, Icons, svgIcon, svgIconFill, relativeTime, formatClock, escapeHtml, trapFocus, openModal, toast };
})();

/* ============================================================
 *  MODULE: Editor (CodeMirror wrapper)
 * ============================================================ */
const EditorModule = (() => {
  let view = null;
  let mountEl = null;
  let suppressChange = false;

  const dslLanguage = StreamLanguage.define({
    token(stream) {
      if (stream.eatSpace()) return null;
      if (stream.match('//')) { stream.skipToEnd(); return 'comment'; }
      if (stream.match('/*')) {
        while (!stream.eol()) {
          if (stream.match('*/')) return 'comment';
          stream.next();
        }
        return 'comment';
      }
      if (stream.match('"')) {
        while (!stream.eol()) {
          const ch = stream.next();
          if (ch === '"') return 'string';
          if (ch === '\\') stream.next();
        }
        return 'string';
      }
      if (stream.match("'")) {
        while (!stream.eol()) {
          const ch = stream.next();
          if (ch === "'") return 'string';
          if (ch === '\\') stream.next();
        }
        return 'string';
      }
      if (stream.match(/^[0-9]+(\.[0-9]+)?/)) return 'number';
      if (stream.match(/^(Правило|Rule|Если|If|ИначеЕсли|ElseIf|Иначе|Else|Решение|Decision|Причина|Reason|Отказ|Reject|Одобрено|Approve|ОграниченныйЛимит|LimitedLimit|И|AND|ИЛИ|OR|НЕ|NOT)\b/)) return 'keyword';
      if (stream.match(/^(<=|>=|!=|==|<|>|=)/)) return 'operator';
      if (stream.match(/^[{}();,.]/)) return 'punctuation';
      if (stream.match(/^[A-Za-zА-Яа-яЁё_][A-Za-zА-Яа-яЁё0-9_]*(\.[A-Za-zА-Яа-яЁё_][A-Za-zА-Яа-яЁё0-9_]*)+/)) return 'field';
      if (stream.match(/^[A-Za-zА-Яа-яЁё_][A-Za-zА-Яа-яЁё0-9_]*/)) return 'ident';
      stream.next();
      return null;
    },
    languageData: {
      commentTokens: { line: '//' }
    }
  });

  const themeExtension = EditorView.theme({
    '&': { backgroundColor: 'var(--cm-bg)', color: 'var(--text-0)' },
    '.cm-content': { caretColor: 'var(--cm-cursor)', fontFamily: 'var(--font-mono)' },
    '.cm-cursor': { borderLeftColor: 'var(--cm-cursor)' },
    '.cm-selectionBackground, &.cm-focused .cm-selectionBackground': { backgroundColor: 'var(--cm-selection)' },
    '.cm-gutters': { backgroundColor: 'var(--cm-gutter)', color: 'var(--cm-gutterText)', border: 'none', borderRight: '1px solid var(--border)' },
    '.cm-activeLineGutter': { backgroundColor: 'var(--bg-hover)' },
    '.cm-activeLine': { backgroundColor: 'var(--bg-hover)' }
  });

  function mount(el, initialContent, onChange) {
    mountEl = el;
    if (view) { view.destroy(); view = null; }

    const state = EditorState.create({
      doc: initialContent,
      extensions: [
        basicSetup,
        dslLanguage,
        themeExtension,
        history(),
        keymap.of([...defaultKeymap, indentWithTab]),
        EditorView.updateListener.of((update) => {
          if (suppressChange) return;
          if (update.docChanged && onChange) {
            onChange(update.state.doc.toString());
          }
        })
      ]
    });
    view = new EditorView({ state, parent: el });
    return view;
  }

  function setContent(content) {
    if (!view) return;
    suppressChange = true;
    try {
      view.dispatch({
        changes: { from: 0, to: view.state.doc.length, insert: content }
      });
    } finally { suppressChange = false; }
  }

  function getContent() { return view ? view.state.doc.toString() : ''; }

  function focus() { if (view) view.focus(); }

  function undo() {
    if (!view) return;
    cmUndo(view);
  }
  function redo() {
    if (!view) return;
    cmRedo(view);
  }

  function format() {
    if (!view) return;
    const src = view.state.doc.toString();
    const formatted = formatDsl(src);
    view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: formatted } });
  }

  function formatDsl(src) {
    let out = '';
    let indent = 0;
    let i = 0;
    const len = src.length;
    let inString = false;
    let stringChar = '';
    let lineStart = true;

    const pushIndent = () => { out += '  '.repeat(indent); };

    while (i < len) {
      const ch = src[i];

      if (inString) {
        out += ch;
        if (ch === '\\' && i + 1 < len) { out += src[i + 1]; i += 2; continue; }
        if (ch === stringChar) inString = false;
        i++;
        continue;
      }

      if (ch === '"' || ch === "'") {
        inString = true;
        stringChar = ch;
        if (lineStart) { pushIndent(); lineStart = false; }
        out += ch;
        i++;
        continue;
      }

      if (ch === '/' && src[i + 1] === '/') {
        if (lineStart) { pushIndent(); lineStart = false; }
        while (i < len && src[i] !== '\n') { out += src[i]; i++; }
        continue;
      }

      if (/\s/.test(ch)) {
        if (ch === '\n') {
          out += '\n';
          lineStart = true;
        }
        i++;
        continue;
      }

      if (ch === '{') {
        if (lineStart) { pushIndent(); lineStart = false; }
        out += ' {\n';
        indent++;
        i++;
        lineStart = true;
        continue;
      }
      if (ch === '}') {
        indent = Math.max(0, indent - 1);
        if (!lineStart) out += '\n';
        pushIndent();
        out += '}';
        lineStart = false;
        i++;
        continue;
      }
      if (ch === ';') {
        out += ';\n';
        lineStart = true;
        i++;
        continue;
      }

      if (lineStart) { pushIndent(); lineStart = false; }
      out += ch;
      i++;
    }
    return out.trim() + '\n';
  }

  function destroy() { if (view) { view.destroy(); view = null; } }

  return { mount, setContent, getContent, focus, format, formatDsl, destroy, undo, redo };
})();

        ...res.trace.map(tr => {
          let text = '';
          let cls = 'ctx';
          if (tr.kind === 'if') {
            text = `if (${tr.expr}) → ${tr.value} ${tr.matched ? '✓' : '✗'}`;

          } else if (tr.kind === 'else') {
            text = 'else';
            cls = 'pass';

            text = `${tr.target} = ${JSON.stringify(tr.value)}`;

  function renderMessage(m) {
    const t = Ui.h;
    const isUser = m.role === 'user';
    const msg = t('div', { class: `msg ${isUser ? 'user' : 'ai'}` });

    if (!isUser) {
      const avatar = t('div', { class: 'msg-avatar', 'aria-hidden': 'true' },
        Ui.svgIconFill(['M10 2a8 8 0 100 16 8 8 0 000-16z'], '0 0 20 20', 16)
      );
      msg.appendChild(avatar);
    }

    const bubble = t('div', { class: 'msg-bubble' });

    if (m.code) {
      bubble.appendChild(document.createTextNode(m.text || ''));
      const code = t('div', { class: 'msg-code' });
      code.textContent = m.code;
      bubble.appendChild(code);
    } else {
      bubble.appendChild(document.createTextNode(m.text || ''));
    }

    if (m.actions && m.actions.length > 0) {
      const actions = t('div', { class: 'msg-actions' });
      m.actions.forEach(a => {
        actions.appendChild(t('button', {
          class: 'msg-action',
          onClick: () => handleAction(a)
        }, a));
      });
      bubble.appendChild(actions);
    }

    bubble.appendChild(t('div', { class: 'msg-time' }, Ui.formatClock(m.ts)));

  function sendChatMessage() {
    const input = document.getElementById('chatInput');
    if (!input) return;
    const text = input.value.trim();
    if (!text) {
      Ui.toast(I18n.t('error.emptyInput'), '', 'warning');
      return;
    }
    input.value = '';

    const state = State.get();
    State.set({ chat: [...state.chat, { role: 'user', text, ts: Date.now() }] });
    render();
    scrollChatToBottom(true);

    const typingEl = renderTyping();
    refs.chatMessages.appendChild(typingEl);
    scrollChatToBottom(true);

    setTimeout(() => {
      typingEl.remove();
      const response = generateAiResponse(text, state);
      const st2 = State.get();
      State.set({ chat: [...st2.chat, response] });
      render();
      scrollChatToBottom(true);
    }, Config.AI_RESPONSE_DELAY_MS);
  }

  function scrollChatToBottom(force = false) {

    if (force || atBottom) el.scrollTop = el.scrollHeight;
  }

  function generateAiResponse(userText, state) {
    const file = State.getActiveFile();
    const lower = userText.toLowerCase();
    const isRu = I18n.getLocale() === 'ru';

    if (/создай|create|новое|new/.test(lower) && file) {
      const ruleName = extractRuleName(userText) || 'НовоеПравило';
      const code = `Правило ${ruleName} {\n  Если (Клиент.Параметр < 100) {\n    Решение = Отказ;\n    Причина = "Не выполнено";\n  }\n}`;
      return {
        role: 'ai',
        text: isRu ? `Создал черновик правила. Посмотрите в редакторе:` : `Created a rule draft. Check the editor:`,
        code,
        actions: [isRu ? 'Тестировать' : 'Test', isRu ? 'Изменить' : 'Edit'],
        ts: Date.now()
      };
    }
    if (/объясни|explain|что делает|what/.test(lower)) {
      return {
        role: 'ai',
        text: isRu
          ? `Правило "${file?.name || ''}" проверяет условия и принимает решение. Если условие в блоке "Если" истинно — выполняется ветка с отказом, иначе — правило проходит.`
          : `The rule "${file?.name || ''}" checks conditions and makes a decision. If the "If" condition is true, the rejection branch is executed; otherwise, the rule passes.`,
        ts: Date.now()
      };
    }
    if (/тест|test|провер|check/.test(lower)) {
      return {
        role: 'ai',
        text: isRu
          ? 'Откройте модалку тестирования кнопкой "Выполнить" — туда можно подать JSON и посмотреть результат.'
          : 'Open the test modal with the "Execute" button — you can supply JSON and see the result.',
        actions: [isRu ? 'Открыть тест' : 'Open test'],
        ts: Date.now()
      };
    }
    return {
      role: 'ai',
      text: isRu
        ? 'Понял вашу задачу. Я проанализировал текущее правило и готов помочь. Что именно вы хотите сделать?'
        : 'Got it. I analyzed the current rule and am ready to help. What would you like to do?',
      actions: [isRu ? 'Тестировать' : 'Test', isRu ? 'Изменить' : 'Edit', isRu ? 'Объяснить' : 'Explain'],
      ts: Date.now()
    };
  }

  function extractRuleName(text) {
    const m = text.match(/(?:правил(?:о|а)|rule)\s+([A-Za-zА-Яа-яЁё0-9_]+)/i);
    return m ? m[1] : null;
  }

    if (kind === 'test') openTestModal();

      setTimeout(() => {
        const st2 = State.get();
        State.set({ chat: [...st2.chat, generateAiResponse('объясни', st2)] });

  function guessTestInput(file) {
    const src = file.content || '';
    const matches = [...src.matchAll(/([A-Za-zА-Яа-яЁё_][A-Za-zА-Яа-яЁё0-9_]*(?:\.[A-Za-zА-Яа-яЁё_][A-Za-zА-Яа-яЁё0-9_]*)+)/g)];
    const fields = new Set();
    matches.forEach(m => { if (m[1].includes('.')) fields.add(m[1]); });
    if (fields.size === 0) return '{\n  "Клиент.Возраст": 25\n}';
    const obj = {};
    fields.forEach(f => { obj[f] = /возраст|age/i.test(f) ? 25 : /доход|income/i.test(f) ? 50000 : 0; });
    return JSON.stringify(obj, null, 2);
  }

  function executeRule(inputData) {
    const file = State.getActiveFile();
    if (!file) return;
    const started = performance.now();
    try {
      const result = DslParser.run(file.content, inputData);
      const timeMs = Math.max(1, Math.round(performance.now() - started));
      State.set({
        ui: {
          ...State.get().ui,
          showResults: true,
          results: { ruleName: file.name, timeMs, result }
        }
      });
      render();
    } catch (e) {
      const timeMs = Math.max(1, Math.round(performance.now() - started));
      State.set({
        ui: {
          ...State.get().ui,
          showResults: true,
          results: { ruleName: file.name, timeMs, error: e.message }
        }
      });
      render();
    }
  }

        ),
        t('button', {
          class: 'btn btn-ghost btn-icon',
          'aria-label': I18n.t('action.close'),
          onClick: () => modal.close()
        }, Ui.icon('x', 18))
      ),
      diffView,
      t('div', { class: 'modal-actions', style: { marginTop: '16px' } },
        t('button', {
          class: 'btn btn-secondary',
          onClick: () => modal.close()
        }, I18n.t('action.close'))
      )
    );
    const modal = Ui.openModal(content);
  }

  function computeSimpleDiff(oldLines, newLines) {
    const m = oldLines.length, n = newLines.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        if (oldLines[i - 1] === newLines[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
        else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
    const stack = [];
    let i = m, j = n;
    while (i > 0 && j > 0) {
      if (oldLines[i - 1] === newLines[j - 1]) {
        stack.push({ type: 'ctx', text: oldLines[i - 1], lineNum: i });
        i--; j--;
      } else if (dp[i - 1][j] >= dp[i][j - 1]) {
        stack.push({ type: 'removed', text: oldLines[i - 1], lineNum: i });
        i--;
      } else {
        stack.push({ type: 'added', text: newLines[j - 1], lineNum: j });
        j--;
      }
    }
    while (i > 0) { stack.push({ type: 'removed', text: oldLines[i - 1], lineNum: i }); i--; }
    while (j > 0) { stack.push({ type: 'added', text: newLines[j - 1], lineNum: j }); j--; }
    stack.reverse();
    return stack;
  }

  function openSettingsModal() {
    const t = Ui.h;
    const state = State.get();
    const content = t('div', {},
      t('div', { class: 'modal-header' },
        t('div', { class: 'modal-title-wrap' },
          t('div', { class: 'modal-icon' }, Ui.icon('settings', 22)),
          t('div', {}, t('h3', { class: 'modal-title' }, 'Settings'))
        ),
        t('button', {
          class: 'btn btn-ghost btn-icon',
          'aria-label': I18n.t('action.close'),
          onClick: () => modal.close()
        }, Ui.icon('x', 18))
      ),
      t('div', { class: 'form-group' },
        t('label', { class: 'form-label' }, 'Theme'),
        t('div', { style: { display: 'flex', gap: '8px' } },
          t('button', {
            class: `btn ${state.theme === 'dark' ? 'btn-primary' : 'btn-secondary'}`,
            onClick: () => { State.set({ theme: 'dark' }); applyTheme('dark'); modal.close(); render(); }
          }, Ui.icon('moon', 16), 'Dark'),
          t('button', {
            class: `btn ${state.theme === 'light' ? 'btn-primary' : 'btn-secondary'}`,
            onClick: () => { State.set({ theme: 'light' }); applyTheme('light'); modal.close(); render(); }
          }, Ui.icon('sun', 16), 'Light')
        )
      ),
      t('div', { class: 'form-group' },
        t('label', { class: 'form-label' }, 'Language'),
        t('div', { style: { display: 'flex', gap: '8px' } },
          t('button', {
            class: `btn ${state.locale === 'ru' ? 'btn-primary' : 'btn-secondary'}`,
            onClick: () => { State.set({ locale: 'ru' }); I18n.setLocale('ru'); document.documentElement.lang = 'ru'; modal.close(); render(); }
          }, 'Русский'),
          t('button', {
            class: `btn ${state.locale === 'en' ? 'btn-primary' : 'btn-secondary'}`,
            onClick: () => { State.set({ locale: 'en' }); I18n.setLocale('en'); document.documentElement.lang = 'en'; modal.close(); render(); }
          }, 'English')
        )
      ),
      t('div', { class: 'modal-actions' },
        t('button', {
          class: 'btn btn-secondary',
          onClick: () => modal.close()
        }, I18n.t('action.close'))
      )
    );
    const modal = Ui.openModal(content);
  }

  function bindGlobal() {
    const mount = refs.editorMount;
    if (mount) {
      const file = State.getActiveFile();
      if (file) {
        EditorModule.mount(mount, file.content || '', (newContent) => {
          State.updateActiveFile({ content: newContent });
        });
      }
    }
  }

  return { render, scrollChatToBottom, executeRule };
})();

/* ============================================================
 *  MODULE: App (init + global shortcuts)
 * ============================================================ */
const App = (() => {
  function init() {
    State.load();
    Renderer.render();

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => Renderer.render(), 150);
    });

    document.addEventListener('keydown', (e) => {
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key === 's') {
        e.preventDefault();
        const state = State.get();
        Storage.save({
          files: state.files,
          activeFileId: state.activeFileId,
          chat: state.chat,
          theme: state.theme,
          locale: state.locale
        });
        Ui.toast(I18n.t('toast.saved'));
      }
      if (mod && e.key === 'Enter') {
        e.preventDefault();
        document.querySelector('.btn-primary')?.click();
      }
    });

    window.addEventListener('beforeunload', (e) => {
      const state = State.get();
      Storage.save({
        files: state.files,
        activeFileId: state.activeFileId,
        chat: state.chat,
        theme: state.theme,
        locale: state.locale
      });
    });

    mountDevPanel();
  }

  function mountDevPanel() {
    const panel = document.createElement('div');
    panel.className = 'dev-panel';
    panel.innerHTML = '';
    const btnTests = document.createElement('button');
    btnTests.textContent = 'Run DSL tests';
    btnTests.addEventListener('click', () => {
      const r = DslParser.runTests();
      if (r.failed === 0) {
        Ui.toast(I18n.t('toast.testsPassed'), `${r.passed}/${r.total}`, 'success');
      } else {
        Ui.toast(I18n.t('toast.testsFailed'), `${r.failed} failed: ${r.failures.map(f => f.name).join(', ')}`, 'error', 6000);
        console.warn('DSL test failures:', r.failures);
      }
    });
    const btnReset = document.createElement('button');
    btnReset.textContent = 'Reset state';
    btnReset.addEventListener('click', () => {
      if (confirm('Reset all state?')) {
        localStorage.removeItem(Config.STORAGE_KEY);
        location.reload();
      }
    });
    panel.appendChild(btnTests);
    panel.appendChild(btnReset);
    document.body.appendChild(panel);
  }

  return { init };
})();

App.init();
</script>
