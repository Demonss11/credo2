[project]
name = "pm-agents"
version = "0.3.0"
description = "Process mining агентского процесса CREDO2: DFG, варианты, метрики (D81)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
viz = ["networkx>=3.3", "matplotlib>=3.9", "plotly>=5.24"]
pm4py = ["pm4py>=2.7.11"]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
pm-agents = "pm_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
